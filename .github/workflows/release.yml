name: Release app

# Run from Actions → "Release app" → Run workflow (enter a version such as
# v0.1.0), or push a tag like v0.1.0. Builds the app and publishes the .dmg.
# Add these repository secrets to sign and notarize (recommended for public
# downloads): DEVELOPER_ID_CERT_P12 (base64), DEVELOPER_ID_CERT_PASSWORD,
# DEVELOPER_ID, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: VERSION="${VERSION#v}" BUILD_NUMBER="$(git rev-list --count HEAD)" scripts/build-app.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          NOTES="docs/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "حمّل ملف ‎.dmg‎ واسحب حلال واين إلى مجلد التطبيقات. — Download the .dmg and drag halalWine to Applications." > dist/notes.md
            NOTES=dist/notes.md
          fi
          # Creates the tag on this commit when it doesn't exist yet.
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "halalWine ${TAG#v}" --notes-file "$NOTES" --latest

name: Publish Windows engine (runtime)

# Builds the runtime the app downloads on first launch and publishes it as a
# GitHub release, then updates Runtime/manifest.json so the app finds it.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "whisky = CrossOver-based Wine with working DXMT (recommended); gcenx = upstream Wine"
        default: "whisky"
      whisky_engine_tag:
        description: "frankea/Whisky 'Wine Libraries' release tag"
        default: "v4.8.3"
      wine_version:
        description: "gcenx only: Gcenx macOS Wine build tag"
        default: "11.21"
      revision:
        description: "Bump to publish twice on the same day"
        default: "1"

permissions:
  contents: write

jobs:
  runtime:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta (for the smoke test)
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Build runtime
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          WHISKY_ENGINE_TAG: ${{ inputs.whisky_engine_tag }}
          WINE_VERSION: ${{ inputs.wine_version }}
          REVISION: ${{ inputs.revision }}
        run: scripts/build-runtime.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dist/runtime.env
          gh release delete "runtime-$VERSION" --yes --cleanup-tag 2>/dev/null || true
          {
            echo "محرّك ويندوز لتطبيق حلال واين — Windows engine for halalWine"
            echo
            echo '```'
            cat dist/RUNTIME-NOTICE.txt
            echo '```'
          } > dist/notes.md
          gh release create "runtime-$VERSION" dist/halalwine-runtime-*.tar.xz dist/RUNTIME-NOTICE.txt \
            --title "Runtime $VERSION" --notes-file dist/notes.md --latest=false
      - name: Update manifest
        run: |
          source dist/runtime.env
          python3 scripts/update-manifest.py dist/runtime-entry.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Runtime/manifest.json
          git commit -m "Publish runtime $VERSION"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done

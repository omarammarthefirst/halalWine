name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app-macos:
    name: App build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Check translations
        run: python3 scripts/check-localization.py
      - name: Core tests
        run: swift test
      - name: Build app and disk image
        run: scripts/build-app.sh
      - name: Smoke-test the packaged app
        run: scripts/smoke-test-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: halalWine-dmg
          path: dist/*.dmg
          if-no-files-found: error
